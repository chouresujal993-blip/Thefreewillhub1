    let allMovies = [];

    function extractCleanUrl(rawInput) {
      if (!rawInput) return '';
      const str = String(rawInput).trim();
      const match = str.match(/https?:\/\/[^\s"'<>]+/i);
      if (match) return match[0].trim();
      if (/^[a-z0-9-]+(\.[a-z0-9-]+)+(\/[^\s]*)?$/i.test(str)) {
        return 'https://' + str;
      }
      return '';
    }

    function previewPoster(input) {
      const file = input.files && input.files[0];
      const img = document.getElementById('mPosterPreview');
      if (!file) {
        img.classList.add('hidden');
        return;
      }
      img.src = URL.createObjectURL(file);
      img.classList.remove('hidden');
    }

    let uploadedScreenshotsArray = [];
    function previewScreenshots(input) {
      const files = Array.from(input.files || []);
      const container = document.getElementById('screenshotsPreviewContainer');
      container.innerHTML = '';
      uploadedScreenshotsArray = [];

      files.forEach(file => {
        const url = URL.createObjectURL(file);
        uploadedScreenshotsArray.push(url);
        const thumb = document.createElement('img');
        thumb.src = url;
        thumb.className = 'w-14 h-18 object-cover rounded border border-zinc-700';
        container.appendChild(thumb);
      });
    }

    function compressImageToDataUrl(file) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            const maxW = 420;
            const scale = Math.min(1, maxW / img.width);
            canvas.width = img.width * scale;
            canvas.height = img.height * scale;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            resolve(canvas.toDataURL('image/jpeg', 0.8));
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

    async function uploadImageFile(file) {
      const ext = (file.name.split('.').pop() || 'jpg').toLowerCase();
      const filePath = `img-${Date.now()}-${Math.random().toString(36.substring(2, 6))}.${ext}`;
      const { error } = await db.storage.from('posters').upload(filePath, file, { upsert: true });
      if (!error) {
        const { data } = db.storage.from('posters').getPublicUrl(filePath);
        if (data && data.publicUrl) return data.publicUrl;
      }
      return await compressImageToDataUrl(file);
    }

    function parseMediaLink(rawUrl) {
      const url = extractCleanUrl(rawUrl);
      if (!url) return { type: 'none', platform: 'Link', icon: ICONS.download, badgeClass: 'bg-red-600 text-white', embedUrl: null, originalUrl: '' };

      const ytMatch = url.match(/(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/)|youtu\.be\/)([a-zA-Z0-9_-]{11})/);
      if (ytMatch) {
        return {
          type: 'iframe',
          platform: 'YouTube',
          icon: ICONS.youtube,
          badgeClass: 'bg-red-600 text-white',
          videoId: ytMatch[1],
          embedUrl: `https://www.youtube.com/embed/${ytMatch[1]}`,
          originalUrl: url
        };
      }

      if (/instagram\.com/i.test(url)) {
        return {
          type: 'external',
          platform: 'Instagram',
          icon: ICONS.instagram,
          badgeClass: 'bg-gradient-to-r from-pink-600 to-red-600 text-white',
          embedUrl: null,
          originalUrl: url
        };
      }

      const driveMatch = url.match(/drive\.google\.com\/file\/d\/([a-zA-Z0-9_-]+)/);
      if (driveMatch) {
        return {
          type: 'iframe',
          platform: 'Google Drive',
          icon: ICONS.drive,
          badgeClass: 'bg-emerald-600 text-white',
          embedUrl: `https://drive.google.com/file/d/${driveMatch[1]}/preview`,
          originalUrl: url
        };
      }

      const dmMatch = url.match(/(?:dailymotion\.com\/video\/|dai\.ly\/)([a-zA-Z0-9]+)/);
      if (dmMatch) {
        return {
          type: 'iframe',
          platform: 'Dailymotion',
          icon: ICONS.play,
          badgeClass: 'bg-sky-600 text-white',
          embedUrl: `https://www.dailymotion.com/embed/video/${dmMatch[1]}`,
          originalUrl: url
        };
      }

      const vimeoMatch = url.match(/vimeo\.com\/(?:video\/)?(\d+)/);
      if (vimeoMatch) {
        return {
          type: 'iframe',
          platform: 'Vimeo',
          icon: ICONS.play,
          badgeClass: 'bg-cyan-600 text-white',
          embedUrl: `https://player.vimeo.com/video/${vimeoMatch[1]}`,
          originalUrl: url
        };
      }

      if (/\.(mp4|webm|ogg|mkv|m3u8)(\?.*)?$/i.test(url)) {
        return {
          type: 'video',
          platform: 'HD Video',
          icon: ICONS.play,
          badgeClass: 'bg-red-600 text-white',
          embedUrl: url,
          originalUrl: url
        };
      }

      if (/(\/embed\/|\/e\/|player\.)/i.test(url)) {
        return {
          type: 'iframe',
          platform: 'Stream',
          icon: ICONS.play,
          badgeClass: 'bg-red-600 text-white',
          embedUrl: url,
          originalUrl: url
        };
      }

      let hostLabel = 'Download';
      try {
        hostLabel = new URL(url).hostname.replace('www.', '');
      } catch (e) {}

      return {
        type: 'external',
        platform: hostLabel,
        icon: ICONS.download,
        badgeClass: 'bg-red-600 text-white',
        embedUrl: null,
        originalUrl: url
      };
    }

    async function saveMovie() {
      const id = document.getElementById('mId').value.trim();
      const title = document.getElementById('mTitle').value.trim();
      const release_year = Number(document.getElementById('mYear').value) || 2026;
      const genre = document.getElementById('mGenre').value;
      const language = document.getElementById('mLanguage').value.trim() || 'Hindi';
      const posterFile = document.getElementById('mPosterFile').files[0];
      let poster_url = extractCleanUrl(document.getElementById('mPosterUrl').value);
      const linkUrl = extractCleanUrl(document.getElementById('mLink').value);
      const synopsis = document.getElementById('mSynopsis').value.trim();
      const screenshotsInput = document.getElementById('mScreenshotsUrl').value.trim();

      if (!title) {
        alert('Please enter a Title.');
        return;
      }

      const btn = document.getElementById('saveMovieBtn');
      btn.disabled = true;
      btn.textContent = 'Saving to Database...';

      try {
        const parsed = parseMediaLink(linkUrl);

        if (posterFile) {
          poster_url = await uploadImageFile(posterFile);
        } else if (!poster_url && !id) {
          if (parsed.platform === 'YouTube' && parsed.videoId) {
            poster_url = `https://i.ytimg.com/vi/${parsed.videoId}/hqdefault.jpg`;
          } else {
            poster_url = DEFAULT_POSTER;
          }
        }

        let screenshots = uploadedScreenshotsArray;
        if (screenshotsInput) {
          screenshots = screenshots.concat(screenshotsInput.split(',').map(s => s.trim()).filter(Boolean));
        }

        const slug = `${title}-${release_year}-${Date.now().toString().slice(-4)}`.toLowerCase().replace(/[^a-z0-9]+/g, '-');

        let movieId = id;

        if (id) {
          // Update existing movie
          const updateData = { title, release_year, genre, language, synopsis };
          if (poster_url) updateData.poster_url = poster_url;
          if (screenshots.length > 0) updateData.screenshots = screenshots;

          const { error } = await db.from('movies').update(updateData).eq('id', id);
          if (error) {
            alert('Update Error: ' + error.message);
            return;
          }
        } else {
          // Insert new movie
          const insertPayload = { title, slug, release_year, genre, language, poster_url: poster_url || DEFAULT_POSTER, synopsis, screenshots: screenshots.length ? screenshots : null };
          const { data: movie, error } = await db.from('movies').insert([insertPayload]).select().single();
          if (error) {
            alert('Insert Error: ' + error.message);
            return;
          }
          movieId = movie.id;
        }

        if (linkUrl && movieId) {
          // Check if link exists
          const { data: existingLinks } = await db.from('download_links').select('id').eq('movie_id', movieId);
          if (existingLinks && existingLinks.length > 0) {
            await db.from('download_links').update({
              quality: parsed.platform,
              file_key: linkUrl,
              stream_url: parsed.embedUrl || linkUrl
            }).eq('movie_id', movieId);
          } else {
            await db.from('download_links').insert([{
              movie_id: movieId,
              quality: parsed.platform,
              file_size: 'HD',
              file_key: linkUrl,
              stream_url: parsed.embedUrl || linkUrl
            }]);
          }
        }

        const st = document.getElementById('adminStatus');
        st.textContent = `Successfully saved "${title}"!`;
        st.classList.remove('hidden');

        resetStudioForm();
        loadMovies();
        renderAdminMovieList();
      } finally {
        btn.disabled = false;
        btn.textContent = '💾 Save & Publish';
      }
    }

    async function deleteCurrentMovie() {
      const id = document.getElementById('mId').value;
      if (!id || !confirm('Are you sure you want to delete this title?')) return;

      await db.from('download_links').delete().eq('movie_id', id);
      await db.from('movies').delete().eq('id', id);

      alert('Deleted successfully.');
      resetStudioForm();
      loadMovies();
      renderAdminMovieList();
      showHome();
      toggleAdminStudio();
    }

    function renderAdminMovieList() {

        return;

      listEl.innerHTML = allMovies.map(m => `
        <div class="flex items-center justify-between bg-zinc-950 px-2.5 py-1.5 rounded border border-zinc-800 text-xs">

          <button onclick="loadMovieIntoStudio('${m.id}')" class="bg-zinc-800 hover:bg-red-600 text-zinc-300 hover:text-white px-2 py-1 rounded text-[10px] font-bold">
            Edit
          </button>
        </div>
      `).join('');

    function loadMovieIntoStudio(id) {
      const movie = allMovies.find(m => String(m.id) === String(id));
      if (!movie) return;

      document.getElementById('mId').value = movie.id;
      document.getElementById('mTitle').value = movie.title || '';
      document.getElementById('mYear').value = movie.release_year || 2026;
      document.getElementById('mGenre').value = movie.genre || 'Movies';
      document.getElementById('mLanguage').value = movie.language || 'Hindi';
      document.getElementById('mPosterUrl').value = movie.poster_url || '';
      if (movie.poster_url) {
        const pPrev = document.getElementById('mPosterPreview');
        pPrev.src = movie.poster_url;
        pPrev.classList.remove('hidden');
      }
      const firstLink = (movie.download_links || [])[0];
      document.getElementById('mLink').value = firstLink ? (firstLink.file_key || firstLink.stream_url || '') : '';
      document.getElementById('mSynopsis').value = movie.synopsis || '';
      document.getElementById('studioModeLabel').textContent = `● Editing: "${movie.title}"`;
      document.getElementById('saveMovieBtn').textContent = '💾 Update Movie';
      document.getElementById('deleteMovieBtn').classList.remove('hidden');
    }

    function quickEditCurrentMovie() {
      if (!currentActiveMovieId) return;
      loadMovieIntoStudio(currentActiveMovieId);
      toggleAdminStudio();
    }

    async function loadMovies() {
      try {
        const { data, error } = await db
          .from('movies')
          .select('*, download_links(*)')
          .order('created_at', { ascending: false });

        if (!error && Array.isArray(data)) {
          allMovies = data;
        }
      } catch (err) {
        console.error(err);
      }
      filterCatalog();
    }

    function getBadgeInfo(links) {
      if (!links || links.length === 0) {
        return { label: 'HD', icon: ICONS.play, badgeClass: 'bg-red-600 text-white' };
      }
      const parsed = parseMediaLink(links[0].file_key || links[0].stream_url);
      return {
        label: links[0].quality || parsed.platform,
        icon: parsed.icon,
        badgeClass: parsed.badgeClass
      };
    }

    function setCategory(cat) {
      currentCategory = cat;
      showHome();
      document.querySelectorAll('.cat-btn').forEach(btn => {
        if (btn.textContent === cat) {
          btn.className = 'cat-btn bg-red-600 text-white px-3.5 py-1 rounded text-xs font-bold whitespace-nowrap';
        } else {
          btn.className = 'cat-btn bg-zinc-900 text-zinc-300 border border-zinc-800 px-3.5 py-1 rounded text-xs font-semibold whitespace-nowrap';
        }
      });
      document.getElementById('sectionTitle').textContent = cat === 'All' ? 'Latest Releases' : cat;
      filterCatalog();
    }

    function filterCatalog() {
      const query = document.getElementById('searchInput').value.toLowerCase().trim();
      const filtered = allMovies.filter(m => {
        const matchesSearch =
          m.title.toLowerCase().includes(query) ||
          String(m.release_year).includes(query) ||
          (m.language || '').toLowerCase().includes(query) ||
          (m.genre || '').toLowerCase().includes(query);

        const matchesCat =
          currentCategory === 'All' ||
          (m.genre || '').toLowerCase().includes(currentCategory.toLowerCase()) ||
          (m.language || '').toLowerCase().includes(currentCategory.toLowerCase());

        return matchesSearch && matchesCat;
      });

      document.getElementById('countLabel').textContent = `${filtered.length} titles`;
      const grid = document.getElementById('movieGrid');

      if (filtered.length === 0) {
        grid.innerHTML = `<p class="col-span-full text-center text-zinc-400 py-16">No titles found in this category.</p>`;
        return;
      }

      grid.innerHTML = filtered.map(movie => {
        const badge = getBadgeInfo(movie.download_links);
        return `
          <div onclick="openMovie('${movie.id}')" class="cursor-pointer group bg-zinc-900 rounded-lg overflow-hidden border border-zinc-800 hover:border-red-500 transition flex flex-col">
            <div class="relative aspect-[2/3] bg-zinc-800 overflow-hidden">
              <img src="${movie.poster_url || DEFAULT_POSTER}" alt="${movie.title}" loading="lazy" class="w-full h-full object-cover group-hover:scale-105 transition duration-300" />
              <span class="absolute top-2 right-2 ${badge.badgeClass} text-[11px] font-extrabold px-2 py-0.5 rounded shadow inline-flex items-center gap-1">
                ${badge.icon}
                <span>${badge.label}</span>
              </span>
            </div>
            <div class="p-3 flex-1 flex flex-col justify-between">
              <h2 class="text-sm font-semibold text-zinc-100 line-clamp-2 group-hover:text-red-400">
                ${movie.title} (${movie.release_year}) ${movie.language || ''}
              </h2>
              <p class="text-[11px] text-zinc-400 mt-2 truncate">${movie.genre || ''}</p>
            </div>
          </div>
        `;
      }).join('');
    }

    function openMovie(id) {
      const movie = allMovies.find(m => String(m.id) === String(id));
      if (!movie) return;

      currentActiveMovieId = movie.id;
      document.getElementById('quickEditBtn').classList.remove('hidden');

      document.getElementById('catalogView').classList.add('hidden');
      document.getElementById('detailView').classList.remove('hidden');
      window.scrollTo(0, 0);

      const firstLink = (movie.download_links || [])[0];
      const rawUrl = firstLink ? (firstLink.file_key || firstLink.stream_url) : null;
      const parsed = parseMediaLink(rawUrl);

      let playerHtml = '';
      if (parsed.type === 'iframe' && parsed.embedUrl) {
        playerHtml = `
          <div class="mt-8 bg-zinc-900 border border-zinc-800 rounded-xl p-4">
            <div class="flex items-center justify-between mb-3">
              <h3 class="text-base sm:text-lg font-bold text-red-500 inline-flex items-center gap-2">
                ${parsed.icon}
                <span>Watch Online (${parsed.platform})</span>
              </h3>
              <a href="${parsed.originalUrl}" target="_blank" rel="noopener noreferrer" class="bg-red-600 hover:bg-red-500 text-white text-xs font-bold px-3 py-1.5 rounded-lg inline-flex items-center gap-1.5">
                ${parsed.icon}
                <span>Open in ${parsed.platform}</span>
              </a>
            </div>
            <div class="relative w-full pt-[56.25%] rounded-lg overflow-hidden bg-black">
              <iframe src="${parsed.embedUrl}" title="${movie.title}" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; fullscreen" allowfullscreen class="absolute inset-0 w-full h-full"></iframe>
            </div>
          </div>`;
      } else if (parsed.type === 'video' && parsed.embedUrl) {
        playerHtml = `
          <div class="mt-8 bg-zinc-900 border border-zinc-800 rounded-xl p-4">
            <h3 class="text-lg font-bold text-red-500 text-center mb-3">Watch Online</h3>
            <video controls preload="metadata" poster="${movie.poster_url || DEFAULT_POSTER}" src="${parsed.embedUrl}" class="w-full max-h-[500px] rounded-lg bg-black"></video>
          </div>`;
      } else if (parsed.type === 'external' && parsed.originalUrl) {
        const isIg = parsed.platform === 'Instagram';
        const btnStyle = isIg
          ? 'bg-gradient-to-r from-pink-600 to-red-600 hover:opacity-90 text-white'
          : 'bg-red-600 hover:bg-red-500 text-white';
        playerHtml = `
          <div class="mt-8 bg-zinc-900 border border-zinc-800 rounded-xl p-6 text-center space-y-3">
            <h3 class="text-lg font-bold text-white inline-flex items-center justify-center gap-2">
              ${parsed.icon}
              <span>Watch on ${parsed.platform}</span>
            </h3>
            <p class="text-xs text-zinc-400">Tap the button below to open this video directly on ${parsed.platform}.</p>
            <a href="${parsed.originalUrl}" target="_blank" rel="noopener noreferrer" class="inline-flex items-center gap-2 ${btnStyle} font-bold px-6 py-3 rounded-lg text-sm shadow-lg">
              ${parsed.icon}
              <span>Open on ${parsed.platform}</span>
            </a>
          </div>`;
      }

      const screenshotsHtml = (movie.screenshots && movie.screenshots.length)
        ? `<div class="mt-8">
             <h3 class="text-lg font-bold text-red-500 text-center mb-4">Preview & Screenshots</h3>
             <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
               ${movie.screenshots.map(url => `<img src="${url}" class="w-full rounded-lg border border-zinc-800 object-cover aspect-video" />`).join('')}
             </div>
           </div>`
        : '';

      const linksHtml = (movie.download_links || []).map(link => {
        const cleanHref = extractCleanUrl(link.file_key);
        if (!cleanHref) {
          return `
            <div class="bg-zinc-950 p-4 rounded-lg border border-zinc-800 text-center text-xs text-zinc-400">
              No valid download URL attached to this entry.
            </div>`;
        }
        const linkParsed = parseMediaLink(cleanHref);
        const btnBg = linkParsed.platform === 'Instagram'
          ? 'bg-gradient-to-r from-pink-600 to-red-600 text-white'
          : 'bg-red-600 hover:bg-red-500 text-white';

        return `
          <div class="flex flex-col sm:flex-row items-center justify-between gap-3 bg-zinc-950 p-4 rounded-lg border border-zinc-800">
            <div class="flex items-center gap-2">
              <span class="text-red-500">${linkParsed.icon}</span>
              <span class="font-bold text-red-400 text-base">${link.quality || linkParsed.platform}</span>
              <span class="text-zinc-400 text-xs">[${link.file_size || 'Link'}]</span>
            </div>
            <div class="flex gap-2 w-full sm:w-auto">
              <a href="${cleanHref}" target="_blank" rel="noopener noreferrer" class="flex-1 sm:flex-initial inline-flex items-center justify-center gap-2 ${btnBg} text-sm font-bold px-5 py-2 rounded-md">
                ${linkParsed.icon}
                <span>Open on ${linkParsed.platform}</span>
              </a>
            </div>
          </div>
        `;
      }).join('');

      document.getElementById('detailContent').innerHTML = `
        <div class="flex flex-col md:flex-row gap-6 bg-zinc-900/70 border border-zinc-800 p-6 rounded-xl">
          <img src="${movie.poster_url || DEFAULT_POSTER}" class="w-56 h-80 object-cover rounded-lg mx-auto md:mx-0 border border-zinc-700" />
          <div class="flex-1 space-y-3">
            <h1 class="text-2xl sm:text-3xl font-bold text-white">${movie.title} (${movie.release_year})</h1>
            <div class="flex flex-wrap gap-2 text-xs text-zinc-300">
              <span class="bg-zinc-800 px-3 py-1 rounded-full">📅 ${movie.release_year}</span>
              <span class="bg-zinc-800 px-3 py-1 rounded-full">🎬 ${movie.genre || ''}</span>
              <span class="bg-zinc-800 px-3 py-1 rounded-full">🌐 ${movie.language || ''}</span>
            </div>
            <p class="text-zinc-300 text-sm leading-relaxed pt-2">${movie.synopsis || ''}</p>
          </div>
        </div>
        ${playerHtml}
        ${screenshotsHtml}
        <div class="mt-8 bg-zinc-900 border border-zinc-800 rounded-xl p-6">
          <h3 class="text-lg font-bold text-center mb-5">Platform & Download Links</h3>
          <div class="space-y-3 max-w-xl mx-auto">${linksHtml}</div>
        </div>
      `;
    }

    function showHome() {
      currentActiveMovieId = null;
      document.getElementById('quickEditBtn').classList.add('hidden');
      document.getElementById('detailView').classList.add('hidden');
      document.getElementById('catalogView').classList.remove('hidden');
    }

    loadMovies();
  </script>
</body>
</html>
